</style></head><body><div id="app">
<div id="st"><canvas id="gl"></canvas>
<div class="hud" style="left:0;top:0"></div><div class="hud" style="left:50%;top:0"></div><div class="hud" style="left:0;top:50%"></div><div class="hud" style="left:50%;top:50%"></div>
<div id="ttl">THEATER OF EPIDAURUS<br><small style="font-size:.45em;color:#fff">Peloponnese, Greece · four beings, one stage</small></div><div id="sub"></div><div id="fd"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TOT=10800,JE=8400,ME=9000,MID=8700;
let T=0,speed=60,playing=true,last=performance.now(),now=last,VW=900,VH=560;
const gl=document.getElementById('gl'),hud=[...document.querySelectorAll('.hud')],sub=document.getElementById('sub'),ttl=document.getElementById('ttl'),fd=document.getElementById('fd');
const g=document.getElementById('mp').getContext('2d');
const R=new THREE.WebGLRenderer({canvas:gl,antialias:false});R.setPixelRatio(1);
function rnd(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const PL={tibet:{n:'Tibet',la:29.65,lo:91.1},rome:{n:'Ancient Rome',la:41.9,lo:12.5},sahara:{n:'Sahara',la:25,lo:10},germany:{n:'Germany',la:51,lo:10.4},epi:{n:'Epidaurus',la:37.6,lo:23.08}};
const BI={tibet:{sky:0x8fc3ff,top:0xf4f8ff,wl:'Snow',t:-8},rome:{sky:0x4aa8ff,top:0x6fae3a,wl:'Clear',t:25},sahara:{sky:0xffb347,top:0xe6c27a,wl:'Heat haze',t:41},germany:{sky:0x7d8a99,top:0x3f8f3a,wl:'Rain',t:11},epi:{sky:0xff9a5a,top:0xc9b98a,wl:'Clear',t:27}};
const LM={tibet:'Potala Palace, Lhasa',rome:'The Colosseum, Rome',sahara:'The Great Pyramids & endless dunes',germany:'The Black Forest',epi:'Theater of Epidaurus'};
const TR=[
{home:'tibet',seed:7,col:'#ffb000',type:'Nordic',forms:[['monk','Buddhist Monk','Year 1203'],['crow','Crow','300 BCE'],['magpie','Magpie','Year 842'],['wood','Woodpecker','Year 1517'],['eagle','Eagle','Year 2044']]},
{home:'rome',seed:21,col:'#3ddc84',type:'Serpentile',forms:[['snake','Serpent','27 BCE'],['turtle','Tortoise','Year 476'],['gecko','Gecko','Year 1066'],['serp','Serpentile','Year 2300']]},
{home:'sahara',seed:33,col:'#ff6b6b',type:'Mantis',forms:[['mantis','Mantis','10000 BCE'],['fox','Fennec Fox','Year 100'],['vulture','Vulture','Year 1350'],['mant','Mantis-kin','Year 2500']]},
{home:'germany',seed:45,col:'#8ab4ff',type:'Grey',forms:[['wolf','Wolf','Year 955'],['owl','Owl','Year 1648'],['hare','Hare','Year 1989'],['grey','Grey','Year 3000']]}];
const keys=['tibet','rome','sahara','germany'];
function hav(a,b){const r=Math.PI/180,R=6371,dl=(b.la-a.la)*r,dn=(b.lo-a.lo)*r,x=Math.sin(dl/2)**2+Math.cos(a.la*r)*Math.cos(b.la*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function build(){TR.forEach((t,i)=>{const r=rnd(t.seed+Math.floor(Math.random()*1e4));let s=[t.home];for(let k=0;k<6;k++){let q;do{q=keys[Math.floor(r()*4)]}while(q===s[s.length-1]);s.push(q)}s.push('epi');t.route=s;t.legs=[];let c=0;for(let k=0;k<7;k++){const d=hav(PL[s[k]],PL[s[k+1]]);t.legs.push({d,c});c+=d}t.total=c;t.lf=undefined;if(P[i]){P[i].loc=null;P[i].lf=undefined;P[i].lt=0;P[i].toast=0}})}
function st(t){const tt=Math.max(0,Math.min(T,JE)),leg=Math.min(6,Math.floor(tt/1200)),f=Math.min(1,(tt-leg*1200)/1200),sm=f*f*(3-2*f),a=PL[t.route[leg]],b=PL[t.route[leg+1]];
return{leg,f,lat:a.la+(b.la-a.la)*sm,lo:a.lo+(b.lo-a.lo)*sm,km:t.legs[leg].c+t.legs[leg].d*sm,loc:f<.5?t.route[leg]:t.route[leg+1],fi:Math.min(t.forms.length-1,Math.floor(tt/JE*t.forms.length))}}
/* ---------- voxel beings ---------- */
const bx=(g,x,y,z,w,h,d,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);g.add(m);return m};
function hum(sk,hr,body,eye,big,sash,tail){const g=new THREE.Group(),hs=big?1:.65,hy=1.6+hs/2;
bx(g,0,1.1,0,.8,1,.45,body);if(sash)bx(g,0,1.1,0,.84,.18,.5,sash);bx(g,0,hy,0,hs,hs,hs,sk);if(hr)bx(g,0,hy+hs/2,0,hs+.04,.12,hs+.04,hr);
const es=big?hs*.3:.12;[-1,1].forEach(s=>bx(g,s*hs*.25,hy+.05,hs/2+.01,es,es*(big?1.3:1),.05,eye));
[-1,1].forEach(s=>bx(g,s*.55,1.1,0,.25,.9,.3,sk));const lg=[-1,1].map(s=>bx(g,s*.2,.35,0,.3,.7,.3,body));
if(tail)bx(g,0,.3,-.9,.4,.3,1.6,tail);g.userData.anim=tm=>{lg[0].rotation.x=Math.sin(tm/150)*.5;lg[1].rotation.x=-Math.sin(tm/150)*.5};return g}
function bird(c,hd,bl,bk,k){const g=new THREE.Group();
bx(g,0,.5*k,0,.8*k,.6*k,1.2*k,c);bx(g,0,.3*k,.1*k,.7*k,.2*k,1*k,bl);bx(g,0,.9*k,.7*k,.5*k,.5*k,.5*k,hd);bx(g,0,.85*k,1.1*k,.15*k,.14*k,.35*k,bk);
[-1,1].forEach(s=>bx(g,s*.2*k,1*k,.95*k,.1*k,.1*k,.05*k,0));bx(g,0,.55*k,-.9*k,.4*k,.1*k,.7*k,c);
const W=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*.4*k,.7*k,0);bx(p,s*.8*k,0,0,1.6*k,.1*k,.8*k,c);g.add(p);return p});
g.userData.anim=tm=>{const a=Math.sin(tm/110)*.8;W[0].rotation.z=-a;W[1].rotation.z=a};return g}
function quad(c,bl,tl,k,eh){const g=new THREE.Group();
bx(g,0,.8*k,0,.7*k,.6*k,1.3*k,c);bx(g,0,.55*k,0,.72*k,.2*k,1.1*k,bl);bx(g,0,1.15*k,.85*k,.5*k,.5*k,.5*k,c);
[-1,1].forEach(s=>{bx(g,s*.15*k,1.5*k+eh*.05*k,.8*k,.12*k,.25*k+eh*.1*k,.12*k,c);bx(g,s*.12*k,1.2*k,1.12*k,.1*k,.1*k,.05*k,0)});bx(g,0,.9*k,-.9*k,.2*k,.2*k,.7*k,tl);
const lg=[];[-1,1].forEach(s=>[-1,1].forEach(z=>lg.push(bx(g,s*.25*k,.25*k,z*.45*k,.2*k,.5*k,.2*k,c))));
g.userData.anim=tm=>lg.forEach((l,i)=>l.rotation.x=Math.sin(tm/120+(i%3?0:3))*.5);return g}
const FORM={
monk:()=>hum(0xf2c9a0,0,0xe07b00,0x222222,0,0x8b0000),
crow:()=>bird(0x111111,0x111111,0x222222,0x999999,1),magpie:()=>bird(0x111111,0x111111,0xffffff,0x333333,1),wood:()=>bird(0x111111,0xdd2222,0xffffff,0x444444,1),eagle:()=>bird(0x6b4423,0xffffff,0x8a5a2b,0xf5b800,1.7),
vulture:()=>bird(0x3b2f2f,0xe8a0a0,0x5a4a4a,0xdddddd,1.6),owl:()=>bird(0xa07a4a,0xc9a36b,0xeeeeee,0xf5b800,1.3),
snake:()=>{const g=new THREE.Group(),sg=[];for(let i=0;i<9;i++)sg.push(bx(g,0,.25,1-i*.45,.5,.5,.5,i%2?0x2fa84f:0x1c6b34));bx(g,0,.25,1.5,.6,.5,.6,0x2fa84f);bx(g,0,.2,1.9,.1,.1,.4,0xee2222);g.userData.anim=tm=>sg.forEach((s,i)=>s.position.x=Math.sin(tm/200+i*.8)*.4);return g},
turtle:()=>{const g=new THREE.Group();bx(g,0,.6,0,1.4,.6,1.6,0x5b8c2a);bx(g,0,1,0,1,.2,1.2,0x7fb03a);bx(g,0,.6,1.1,.4,.4,.5,0x9acd32);const lg=[];[-1,1].forEach(s=>[-1,1].forEach(z=>lg.push(bx(g,s*.6,.2,z*.55,.3,.4,.3,0x9acd32))));g.userData.anim=tm=>lg.forEach((l,i)=>l.rotation.x=Math.sin(tm/300+i)*.4);return g},
gecko:()=>quad(0x7bbf3a,0xb9e07a,0x7bbf3a,.9,0),fox:()=>quad(0xf0a050,0xffffff,0xf0a050,1,3),wolf:()=>quad(0x777777,0xbbbbbb,0x666666,1.3,2),hare:()=>quad(0xd8c3a5,0xffffff,0xffffff,1,5),
mantis:()=>{const g=new THREE.Group(),c=0x5dbb3a;bx(g,0,1.4,0,.3,1.6,.3,c);bx(g,0,2.4,.15,.5,.4,.4,c);[-1,1].forEach(s=>{bx(g,s*.25,2.5,.3,.15,.15,.1,0);bx(g,s*.3,1.9,.45,.1,.1,.8,c);bx(g,s*.15,.4,0,.1,.8,.1,c);bx(g,s*.1,2.9,.1,.05,.6,.05,c)});return g},
mant:()=>{const g=hum(0x6fbf3a,0,0x4a8f2a,0,1,0);[-1,1].forEach(s=>bx(g,s*.25,2.9,0,.1,.7,.1,0x6fbf3a));return g},
serp:()=>hum(0x2fa84f,0,0x1c6b34,0xffd800,0,0xffd800,0x2fa84f),
grey:()=>hum(0xaeb5ba,0,0x8a9096,0,1,0)};
const FLY=['crow','magpie','wood','eagle','vulture','owl'];
/* ---------- panes ---------- */
const NX=10,NZ=44,D=new THREE.Object3D(),CC=new THREE.Color();
const hgt=(x,z,sd)=>Math.max(1,Math.round(3+1.1*Math.sin(z*.3+sd)+.9*Math.sin(x*.35+z*.11)+Math.max(0,Math.abs(x)-3)*.12));
function mkDeco(l){const g=new THREE.Group();
if(l==='tibet'){bx(g,0,2,0,.3,4,.3,0x5a4a3a);[0xee3333,0xffdd00,0x3399ff,0xffffff,0x22cc44].forEach((c,k)=>bx(g,.6,3.6-k*.55,0,1,.5,.1,c))}
else if(l==='rome'||l==='epi'){bx(g,0,2,0,.8,4,.8,0xf0ece0);bx(g,0,4.2,0,1.4,.4,1.4,0xd6d0be)}
else if(l==='sahara'){if(Math.random()<.4)for(let k=0;k<5;k++)bx(g,0,.5+k,0,(5-k)*1.6,1,(5-k)*1.6,0xd9b25a);else{bx(g,0,1.5,0,.5,3,.5,0x2e8b3a);bx(g,-.6,2,0,.7,.4,.4,0x2e8b3a);bx(g,-.9,2.5,0,.4,1,.4,0x2e8b3a)}}
else{bx(g,0,1,0,.5,2,.5,0x5a3a1a);bx(g,0,3,0,2.4,1.6,2.4,0x1f6b2a);bx(g,0,4.4,0,1.6,1.4,1.6,0x2a7b34);bx(g,0,5.4,0,.8,1,.8,0x2a7b34)}return g}
const P=TR.map((t,i)=>{const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(55,1.6,.1,80);
const hemi=new THREE.HemisphereLight(0xffffff,0x665544,.9);sc.add(hemi);const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(5,10,-3);sc.add(dl);
const ter=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial(),(2*NX+1)*NZ);ter.frustumCulled=false;sc.add(ter);
const ch=new THREE.Group();sc.add(ch);
const sg=new THREE.BufferGeometry(),sa=new Float32Array(600);for(let k=0;k<600;k++)sa[k]=(Math.random()-.5)*40;sg.setAttribute('position',new THREE.BufferAttribute(sa,3));
const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.3}));sc.add(stars);
const wg=new THREE.BufferGeometry(),wa=new Float32Array(900);for(let k=0;k<300;k++){wa[k*3]=(Math.random()-.5)*24;wa[k*3+1]=Math.random()*14;wa[k*3+2]=Math.random()*22-8}
wg.setAttribute('position',new THREE.BufferAttribute(wa,3));const wx=new THREE.Points(wg,new THREE.PointsMaterial({color:0xffffff,size:.15}));wx.frustumCulled=false;sc.add(wx);
return{sc,cam,ter,ch,stars,wx,wa,hemi,dec:[],base:null,loc:null,fk:undefined,pop:0,lt:0,lf:undefined,toast:0,y:3}});
build();
function terr(p,t,b,base){let n=0;for(let xi=-NX;xi<=NX;xi++)for(let k=-8;k<NZ-8;k++){const z=base+k,h=hgt(xi,z,t.seed),H=h+4;D.position.set(xi,h-H/2,z);D.scale.set(1,H,1);D.updateMatrix();p.ter.setMatrixAt(n,D.matrix);CC.set(b.top).offsetHSL(0,0,(hash(xi*31+z*17)-.5)*.09);p.ter.setColorAt(n,CC);n++}p.ter.instanceMatrix.needsUpdate=true;p.ter.instanceColor.needsUpdate=true}
function setForm(p,key){while(p.ch.children.length)p.ch.remove(p.ch.children[0]);p.ch.add(FORM[key]());p.fk=key;p.pop=now}
function upd(p,t,i,dt){const s=st(t),loc=s.loc,b=BI[loc],intro=T<420,f=t.forms[s.fi];
if(p.loc!==loc){if(p.loc)p.lt=now+4000;p.loc=loc;p.base=null;p.sc.background=new THREE.Color(b.sky);p.sc.fog=new THREE.Fog(b.sky,16,42);
p.dec.forEach(d=>p.sc.remove(d.g));p.dec=[];for(let k=0;k<8;k++){const g=mkDeco(loc);p.sc.add(g);p.dec.push({g,z:-999,x:0})}
p.wx.visible=b.wl==='Snow'||b.wl==='Rain';p.wx.material.color.set(b.wl==='Rain'?0x6aa7ff:0xffffff)}
const off=T*.4+t.seed*7,base=Math.floor(off);if(p.base!==base){p.base=base;terr(p,t,b,base)}
const day=(T/1800)%1;p.hemi.intensity=.55+.45*Math.cos(day*6.283);
p.dec.forEach((d,k)=>{if(d.z<off-10||d.z===-999){d.z=d.z===-999?off-6+k*7+Math.random()*3:d.z+56;d.x=(Math.random()<.5?-1:1)*(4+Math.random()*(loc==='sahara'?7:5))}
d.g.position.set(d.x,hgt(Math.round(d.x),Math.round(d.z),t.seed),d.z)});
const fk=intro?'fox':f[0];if(p.fk!==fk)setForm(p,fk);
if(p.lf!==s.fi){if(p.lf!==undefined)p.toast=now+3500;p.lf=s.fi}
const ty=hgt(0,Math.round(off),t.seed);p.y+=(ty-p.y)*.2;const fly=FLY.includes(fk);
if(intro){p.ch.position.set(0,Math.sin(now/500+i)*.4,0);p.ch.rotation.set(0,now/1500,0);p.sc.background=new THREE.Color(0x05061a);p.sc.fog=null;p.ter.visible=false;p.stars.visible=true;p.stars.rotation.y=now/4000;p.dec.forEach(d=>d.g.visible=false);p.wx.visible=false;p.cam.position.set(0,1.5,6);p.cam.lookAt(0,.8,0)}
else{p.ter.visible=true;p.stars.visible=false;p.dec.forEach(d=>d.g.visible=true);p.wx.visible=b.wl==='Snow'||b.wl==='Rain';p.sc.background=new THREE.Color(b.sky);if(!p.sc.fog)p.sc.fog=new THREE.Fog(b.sky,16,42);
p.ch.rotation.set(0,0,0);p.ch.position.set(0,p.y+(fly?3.5+Math.sin(now/400)*.5:0),off);p.cam.position.set(3,p.y+6.5,off-9);p.cam.lookAt(0,p.y+1,off+3);
const sp=b.wl==='Rain'?14:3;for(let k=0;k<300;k++){p.wa[k*3+1]-=sp*dt;if(p.wa[k*3+1]<0)p.wa[k*3+1]=14;if(sp<5)p.wa[k*3]+=Math.sin(now/700+k)*.01}p.wx.geometry.attributes.position.needsUpdate=true;p.wx.position.set(0,p.y-2,off-4)}
const sc=Math.max(.05,Math.min(1,(now-p.pop)/800));p.ch.scale.setScalar(sc*(intro?1.2:1));if(p.ch.children[0].userData.anim)p.ch.children[0].userData.anim(now);
hud[i].innerHTML='<b style="color:'+t.col+'">'+t.type.toUpperCase()+' · '+PL[loc].n+'</b><br>'+f[1]+' · '+f[2]+'<br>'+(intro?'Deep space':b.wl+' '+Math.round(b.t+Math.sin(T/500)*3)+'°C')+' · '+Math.round(s.km).toLocaleString()+' km'
+(intro?'<div class="tt" style="color:#9cf">Drifting through space toward '+PL[t.home].n+'…</div>':now<p.toast?'<div class="tt" style="color:#ffd54a">✦ Transforms into '+f[1]+'</div>':now<p.lt?'<div class="tt" style="color:#8ef">📍 '+LM[loc]+'</div>':'')}
/* ---------- theatre ---------- */
const LINES=[
{w:0,t:'I began in Tibet as a quiet monk. I bowed to every stone, river and animal, and one dawn the mountain turned me into a crow.'},
{w:1,t:'I slid out of Rome’s marble cracks. A serpent, then a tortoise, then older than any empire that walked over me.'},
{w:2,t:'I stood still in the Sahara until the dunes forgot me. Stillness taught me to change: fox, vulture, then mantis again.'},
{w:3,t:'I watched from Germany’s dark forests, first as a wolf. They call my kind cold. We only look at things for a long time.'},
{w:0,t:'Magpie, woodpecker, eagle: every skin was a century. From high above I saw the road that joined all four of us.'},
{w:1,t:'The road was never straight. Some days north, some days backwards in time. But I never hurried.'},
{w:2,t:'I did hurry once. As a fennec fox I ran so fast I forgot where I was going.'},
{w:3,t:'I was a hare for a season. I outran the wind, then slept under a tree. You know how that story ends.'},
{w:1,t:'I was the tortoise who passed the sleeping hare. Step. Step. Step.'},
{w:0,t:'Fast feet find no home. Slow feet arrive.'},
{w:2,t:'We counted the miles together: {km} kilometres across four skies and many centuries.'},
{w:3,t:'Snow, sand, rain and sun. Empires rose and fell above us. We only had to keep walking.'},
{w:4,t:'Better to slow down and reach your goal than to go fast and never make it to the end.'},
{w:5,t:'— Aesop, “The Tortoise and the Hare”'}];
const AUD=[0xf2c9a0,0xaeb5ba,0x3ddc84,0xff9a3d,0xc97b3c,0xffffff,0x8ab4ff,0x5dbb3a];
